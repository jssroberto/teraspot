[project]
name = "teraspot-fog"
version = "0.1.0"
description = "TeraSpot Edge Computing & YOLO Publisher"
requires-python = ">=3.12"
dependencies = [
    "torch==2.5.0",
    "torchvision==0.20.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python>=4.10.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "awsiotsdk>=1.12.0",
    "paho-mqtt==1.6.1",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "ultralytics>=8.3.0",
    "requests>=2.31.0"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
package = false
