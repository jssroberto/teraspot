name: CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/lambdas-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/lambdas-ci.yml"

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SECURITY_TOKEN: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-test.txt

      - name: Test ingest_status
        run: |
          cd backend
          pytest lambdas/ingest_status/tests/ -v

      - name: Test analytics_notifier
        run: |
          cd backend
          pytest lambdas/analytics_notifier/tests/ -v

      - name: Test read_status
        run: |
          cd backend
          pytest lambdas/read_status/tests/ -v

      - name: Test config_saver
        run: |
          cd backend
          CI=true pytest lambdas/config_saver/tests/ -v

      - name: Test kpi_monitor
        run: |
          cd backend
          pytest lambdas/kpi_monitor/tests/ -v
