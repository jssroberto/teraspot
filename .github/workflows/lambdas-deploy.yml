name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/lambdas-deploy.yml"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --all-packages

      - name: Run Orchestrated Monorepo Tests
        run: make test

  deploy:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ingest_status
        run: |
          cd backend/lambdas/ingest_status
          rm -rf package lambda.zip
          mkdir -p package
          cp -r ../../shared/utils package/
          cp -R ./*.py package/
          cd package && zip -r ../lambda.zip . && cd ..
          aws lambda update-function-code \
            --function-name teraspot-ingest-status \
            --zip-file fileb://lambda.zip

      - name: Deploy analytics_notifier
        run: |
          cd backend/lambdas/analytics_notifier
          rm -rf package lambda.zip
          mkdir -p package
          cp -r ../../shared/utils package/
          cp lambda_function.py package/
          cd package && zip -r ../lambda.zip . && cd ..
          aws lambda update-function-code \
            --function-name teraspot-analytics-notifier \
            --zip-file fileb://lambda.zip

      - name: Deploy read_status
        run: |
          cd backend/lambdas/read_status
          rm -rf package lambda.zip
          mkdir -p package
          cp -r ../../shared/utils package/
          cp lambda_function.py package/
          cd package && zip -r ../lambda.zip . && cd ..
          aws lambda update-function-code \
            --function-name teraspot-read-status \
            --zip-file fileb://lambda.zip

      - name: Deploy config_saver
        run: |
          cd backend/lambdas/config_saver
          rm -rf package lambda.zip
          mkdir -p package
          cp -r ../../shared/utils package/
          cp lambda_function.py package/
          cd package && zip -r ../lambda.zip . && cd ..
          aws lambda update-function-code \
            --function-name teraspot-config-saver \
            --zip-file fileb://lambda.zip

      - name: Deploy kpi_monitor
        run: |
          cd backend/lambdas/kpi_monitor
          rm -rf package lambda.zip
          mkdir -p package
          cp -r ../../shared/utils package/
          cp lambda_function.py package/
          cd package && zip -r ../lambda.zip . && cd ..
          aws lambda update-function-code \
            --function-name teraspot-kpi-monitor \
            --zip-file fileb://lambda.zip

      - name: Deploy device_command
        run: |
          cd backend/lambdas/device_command
          rm -rf package lambda.zip
          mkdir -p package
          cp -r ../../shared/utils package/
          cp lambda_function.py package/
