name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/lambdas-deploy.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --all-packages

      - name: Run Orchestrated Monorepo Tests
        run: make test

  deploy:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ingest_status
        run: |
          ./scripts/package-lambda.sh ingest_status
          aws lambda update-function-code \
            --function-name teraspot-ingest-status \
            --zip-file fileb://backend/lambdas/ingest_status/lambda.zip

      - name: Deploy analytics_notifier
        run: |
          ./scripts/package-lambda.sh analytics_notifier
          aws lambda update-function-code \
            --function-name teraspot-analytics-notifier \
            --zip-file fileb://backend/lambdas/analytics_notifier/lambda.zip

      - name: Deploy read_status
        run: |
          ./scripts/package-lambda.sh read_status
          aws lambda update-function-code \
            --function-name teraspot-read-status \
            --zip-file fileb://backend/lambdas/read_status/lambda.zip

      - name: Deploy config_saver
        run: |
          ./scripts/package-lambda.sh config_saver
          aws lambda update-function-code \
            --function-name teraspot-config-saver \
            --zip-file fileb://backend/lambdas/config_saver/lambda.zip

      - name: Deploy kpi_monitor
        run: |
          ./scripts/package-lambda.sh kpi_monitor
          aws lambda update-function-code \
            --function-name teraspot-kpi-monitor \
            --zip-file fileb://backend/lambdas/kpi_monitor/lambda.zip

      - name: Deploy device_command
        run: |
          ./scripts/package-lambda.sh device_command
          aws lambda update-function-code \
            --function-name teraspot-device-command \
            --zip-file fileb://backend/lambdas/device_command/lambda.zip

      - name: Deploy ws_connect
        run: |
          ./scripts/package-lambda.sh ws_connect
          aws lambda update-function-code \
            --function-name teraspot-ws-connect \
            --zip-file fileb://backend/lambdas/ws_connect/lambda.zip

      - name: Deploy ws_disconnect
        run: |
          ./scripts/package-lambda.sh ws_disconnect
          aws lambda update-function-code \
            --function-name teraspot-ws-disconnect \
            --zip-file fileb://backend/lambdas/ws_disconnect/lambda.zip

