name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/lambdas-deploy.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Install dependencies
        run: uv sync --frozen --python 3.12 --all-packages

      - name: Run Orchestrated Monorepo Tests
        run: make test

  deploy:
    needs: test
    runs-on: ubuntu-22.04
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ingest_status
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: ingest_status
          function-name: teraspot-ingest-status

      - name: Deploy analytics_notifier
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: analytics_notifier
          function-name: teraspot-analytics-notifier

      - name: Deploy read_status
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: read_status
          function-name: teraspot-read-status

      - name: Deploy config_saver
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: config_saver
          function-name: teraspot-config-saver

      - name: Deploy kpi_monitor
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: kpi_monitor
          function-name: teraspot-kpi-monitor

      - name: Deploy device_command
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: device_command
          function-name: teraspot-device-command

      - name: Deploy ws_connect
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: ws_connect
          function-name: teraspot-ws-connect

      - name: Deploy ws_disconnect
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: ws_disconnect
          function-name: teraspot-ws-disconnect

