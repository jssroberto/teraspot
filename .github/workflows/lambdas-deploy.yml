          aws lambda update-function-code \
            --function-name teraspot-device-command \
            --zip-file fileb://lambda.zip

      - name: Deploy ws_connect
        run: |
          cd backend/lambdas/ws_connect
          rm -rf package lambda.zip
          mkdir -p package
          cp -r ../../shared/utils package/
          cp lambda_function.py package/
          cd package && zip -r ../lambda.zip . && cd ..
          aws lambda update-function-code \
            --function-name teraspot-ws-connect \
            --zip-file fileb://lambda.zip

      - name: Deploy ws_disconnect
        run: |
          cd backend/lambdas/ws_disconnect
          rm -rf package lambda.zip
          mkdir -p package
          cp -r ../../shared/utils package/
          cp lambda_function.py package/
          cd package && zip -r ../lambda.zip . && cd ..
