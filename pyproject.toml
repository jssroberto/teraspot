[project]
name = "teraspot-workspace"
version = "0.1.0"
description = "TeraSpot AI-powered smart parking solution workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "backend/shared",
    "backend/lambdas/*",
    "fog"
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "moto[all]>=4.0.0",
    "python-dateutil>=2.8.2",
    "boto3>=1.26.0",
    "types-boto3[dynamodb]>=1.26.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "backend/lambdas",
    "backend/shared/tests",
    "fog/tests"
]
pythonpath = [
    "backend/shared",
    "backend/lambdas/ingest_status",
    "backend/lambdas/analytics_notifier",
    "backend/lambdas/read_status",
    "backend/lambdas/config_saver",
    "backend/lambdas/kpi_monitor",
    "backend/lambdas/device_command",
    "backend/lambdas/ws_connect",
    "backend/lambdas/ws_disconnect",
    "fog/src"
]
