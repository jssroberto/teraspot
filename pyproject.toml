[project]
name = "teraspot-workspace"
version = "0.1.0"
description = "TeraSpot AI-powered smart parking solution workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "backend/shared",
    "backend/lambdas/*",
    "fog"
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "moto[all]>=4.0.0",
    "python-dateutil>=2.8.2",
    "boto3>=1.26.0"
]
